    "type": "object",
    "properties": {
      "payload": {
        "type": "object",
        "properties": {
          "purchase_order_id": {
            "type": "string",
            "description": "purchase order id"
          },
          "amount": {
            "type": "number",
            "description": "amount"
          },
          "approval_thresholds": {
            "type": "array",
            "description": "approval thresholds"
          },
          "approvals": {
            "type": "array",
            "description": "approvals"
          }
        },
        "required": [
